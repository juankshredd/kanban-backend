name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban
          POSTGRES_DB: kanban_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kanban"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_USER: kanban
      DB_HOST: localhost
      DB_NAME: kanban_test
      DB_PASSWORD: kanban
      DB_PORT: 5432
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run migrate

      - name: Seed test user
        run: npm run seed:test

      - name: Run tests
        run: npx jest

      # Newman corre contra un server real (no supertest in-process como Jest),
      # así que necesita el server levantado y escuchando en el puerto 5000.
      - name: Start server for Postman/Newman
        run: nohup npm run dev > server.log 2>&1 &

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:5000/test-db --timeout 30000

      - name: Run Postman collection (Newman)
        run: npm run test:postman

      - name: Show server log on failure
        if: failure()
        run: cat server.log || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # This must be the Blueprint's Sync Hook (api.render.com/sync/exs-...), not a
      # per-service Deploy Hook (api.render.com/deploy/srv-...) -- see CLAUDE.md's
      # Deployment section. Both return 2xx, but only the sync hook re-reads
      # render.yaml through the Blueprint, which is what CI gating relies on.
      - name: Trigger Render sync hook
        env:
          RENDER_SYNC_HOOK_URL: ${{ secrets.RENDER_SYNC_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_SYNC_HOOK_URL"
